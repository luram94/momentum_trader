[theme]
base = "dark"
primaryColor = "#5eead4"
backgroundColor = "#0b1423"
secondaryBackgroundColor = "#111f32"
textColor = "#e6edf7"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
