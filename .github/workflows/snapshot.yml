name: Nightly data snapshot
# Runs the full Yahoo refresh after the US close (21:00 UTC in winter,
# 20:00 UTC in summer) and publishes it for the app's Refresh Data button
# (see hqm/snapshot.py).
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write  # upload the release asset
concurrency:
  group: data-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hqm.snapshot stocks_snapshot.json.gz
      - name: Publish to the data-snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-snapshot >/dev/null 2>&1 || gh release create data-snapshot \
            --prerelease --title 'Nightly data snapshot' \
            --notes 'Refreshed every weekday after the US close by .github/workflows/snapshot.yml. Read by the app; not a code release.'
          gh release upload data-snapshot stocks_snapshot.json.gz --clobber
